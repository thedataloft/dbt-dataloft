# One target per adapter. No credentials or project names live here -- only env var names,
# so this file is safe in a public repo. Select with --target (default: duckdb).
dbt_dataloft_integration_tests:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: integration_tests.duckdb   # gitignored (*.duckdb)
      threads: 1

    # gcloud auth application-default login, then set DBT_BQ_PROJECT.
    bigquery:
      type: bigquery
      method: oauth
      project: "{{ env_var('DBT_BQ_PROJECT', '') }}"
      dataset: "{{ env_var('DBT_BQ_DATASET', 'dbt_dataloft_integration_tests') }}"
      location: "{{ env_var('DBT_BQ_LOCATION', 'US') }}"
      threads: 4
      job_execution_timeout_seconds: 300

    # pip install dbt-snowflake, then set the DBT_SF_* variables.
    snowflake:
      type: snowflake
      account: "{{ env_var('DBT_SF_ACCOUNT', '') }}"
      user: "{{ env_var('DBT_SF_USER', '') }}"
      authenticator: "{{ env_var('DBT_SF_AUTHENTICATOR', 'externalbrowser') }}"
      role: "{{ env_var('DBT_SF_ROLE', '') }}"
      warehouse: "{{ env_var('DBT_SF_WAREHOUSE', '') }}"
      database: "{{ env_var('DBT_SF_DATABASE', '') }}"
      schema: "{{ env_var('DBT_SF_SCHEMA', 'dbt_dataloft_integration_tests') }}"
      threads: 4
